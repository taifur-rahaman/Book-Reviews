const READ={"Percy Jackson and the Olympians":true,"The Perks of Being a Wallflower":true};

let activeGenre="all", activeLevel=0;
let openCards={};
let sid=0;

function buildGenreTabs(){
  const d=document.getElementById('gtabs');
  let h=`<button class="gt on" id="g-all" onclick="setGenre('all')" style="background:#F1EFE8;color:#444441;border-color:#B4B2A9">All genres</button>`;
  GENRES.forEach(g=>{
    h+=`<button class="gt" id="g-${g.id}" onclick="setGenre('${g.id}')" style="">${g.label}</button>`;
  });
  d.innerHTML=h;
}

function setGenre(id){
  activeGenre=id;
  document.querySelectorAll('.gt').forEach(b=>b.classList.remove('on'));
  const btn=document.getElementById('g-'+id);
  if(id==='all'){btn.style.cssText="background:#F1EFE8;color:#444441;border-color:#B4B2A9";}
  else{const g=GENRES.find(x=>x.id===id);btn.style.cssText=`background:${g.bg};color:${g.tx};border-color:${g.br}`;}
  btn.classList.add('on');
  activeLevel=0;
  buildLevelBtns();
  render();
}

function buildLevelBtns(){
  const d=document.getElementById('lvlrow');
  const levels=[...new Set(DATA.filter(x=>activeGenre==='all'||x.genre===activeGenre).map(x=>x.level))].sort((a,b)=>a-b);
  let h=`<button class="lb on" id="lv-0" onclick="setLv(0)">All levels</button>`;
  levels.forEach(n=>{ h+=`<button class="lb" id="lv-${n}" onclick="setLv(${n})">Level ${n}</button>`; });
  d.innerHTML=h;
}

function setLv(n){
  activeLevel=n;
  document.querySelectorAll('.lb').forEach(b=>b.classList.remove('on'));
  document.getElementById('lv-'+n).classList.add('on');
  render();
}

function toggleCard(id){
  openCards[id]=!openCards[id];
  const b=document.getElementById('scb-'+id);
  const a=document.getElementById('arr-'+id);
  if(b)b.className='scb'+(openCards[id]?' op':'');
  if(a)a.className='arr'+(openCards[id]?' op':'');
}

function gInfo(gid){return GENRES.find(x=>x.id===gid)||{bg:'#F1EFE8',tx:'#444441',br:'#B4B2A9'};}

function render(){
  const q=document.getElementById('sq').value.toLowerCase();
  const out=document.getElementById('out');
  let html='', totalSeries=0, totalBooks=0;
  sid=0;

  const genres=activeGenre==='all'?GENRES.map(g=>g.id):[activeGenre];

  genres.forEach(gid=>{
    const g=gInfo(gid);
    const gLabel=GENRES.find(x=>x.id===gid)?.label||gid;
    const rows=DATA.filter(x=>x.genre===gid&&(activeLevel===0||x.level===activeLevel));
    if(!rows.length)return;

    let gHtml='';
    rows.forEach(row=>{
      let secHtml='', sc=0;
      row.series.forEach(s=>{
        const match=!q||s.name.toLowerCase().includes(q)||s.author.toLowerCase().includes(q)||(s.tags||[]).some(t=>t.toLowerCase().includes(q))||s.books.some(b=>b.t.toLowerCase().includes(q));
        if(!match)return;
        sc++;totalSeries++;
        const id=sid++;
        const bookCount=s.books.length;
        totalBooks+=bookCount;
        const allDone=s.books.every(b=>b.read);
        const hasReading=s.books.some(b=>b.reading);
        const prog=s.progress;
        let statusLabel=s.seriesStatus;
        let statusClass='status-complete';
        if(s.seriesStatus==='Ongoing'){statusClass='status-ongoing';}
        if(prog==='done'||allDone){statusClass='status-done';statusLabel='Done';}
        else if(prog==='reading'||hasReading){statusClass='status-reading';statusLabel='Reading now';}
        else if(prog==='next'){statusClass='status-next';statusLabel='Read next';}

        const isOpen=openCards[id]||false;

        secHtml+=`
          <div class="sc${allDone?' done-card':''}">
            <div class="sch" onclick="toggleCard(${id})">
              <div class="scl">
                <div class="scn">${s.name}</div>
                <div class="sca">${s.author}</div>
                <div class="pills">
                  ${(s.tags||[]).map(t=>`<span class="pl" style="background:${g.bg};color:${g.tx}">${t}</span>`).join('')}
                  <span class="pl ${statusClass}">${statusLabel}</span>
                  <span class="pl" style="background:var(--color-background-secondary);color:var(--color-text-secondary)">${bookCount} book${bookCount!==1?'s':''}</span>
                </div>
                ${s.note?`<div class="note">${s.note}</div>`:''}
              </div>
              <div class="arr${isOpen?' op':''}" id="arr-${id}">&#9660;</div>
            </div>
            <div class="scb${isOpen?' op':''}" id="scb-${id}">
              ${s.books.map(b=>{
                let cls='bt'; let extra='';
                if(b.read){cls='bt bdone';}
                else if(b.reading){cls='bt breading';extra=' ← reading now';}
                return `<div class="br"><span class="bn" style="color:var(--color-text-secondary)">#${b.n}</span><span class="${cls}">${b.t}${extra}</span><span class="by">${b.y}</span></div>`;
              }).join('')}
              <button class="ab" onclick="sendPrompt('Tell me about the series ${s.name} by ${s.author} and why I should read it')">Tell me more about this series ↗</button>
            </div>
          </div>`;
      });
      if(!sc)return;
      gHtml+=`
        <div class="lsec">
          <div class="lhdr">
            <div class="lnum" style="background:${g.bg};color:${g.tx};border:1px solid ${g.br}">L${row.level}</div>
            <div class="ltxt">
              <div class="lt">${gLabel} — ${row.levelLabel}</div>
              <div class="ld">${row.levelDesc}</div>
            </div>
          </div>
          <div class="sgrid">${secHtml}</div>
        </div>`;
    });

    if(gHtml&&activeGenre==='all'){
      html+=`<div style="margin-bottom:2rem"><div style="font-size:14px;font-weight:500;color:${g.tx};background:${g.bg};display:inline-block;padding:4px 14px;border-radius:12px;margin-bottom:12px;border:1px solid ${g.br}">${gLabel}</div>${gHtml}</div>`;
    } else if(gHtml){
      html+=gHtml;
    }
  });

  if(!html){out.innerHTML=`<div style="text-align:center;padding:3rem;color:var(--color-text-secondary);font-size:13px">No books found — try a different search</div>`;}
  else out.innerHTML=html;
  document.getElementById('stat').textContent=`Showing ${totalSeries} series · ${totalBooks} books`;
}

buildGenreTabs();
buildLevelBtns();
render();
</script>
